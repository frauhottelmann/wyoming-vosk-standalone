services:
  vosk:
    image: ghcr.io/frauhottelmann/wyoming-vosk-standalone:1
    environment:
      - CORRECT_SENTENCES=0.0
      - PRELOAD_LANGUAGE=en
      - DEBUG_LOGGING=true
      - LIMIT_SENTENCES=true
      - ALLOW_UNKNOWN=false
      # User/group that owns ./vosk/data and ./vosk/sentences
      - PUID=1000
      - PGID=1000
    volumes:
      - ./vosk/data:/data
      - ./vosk/sentences:/share/vosk/sentences
      - ./vosk/models:/share/vosk/models
    ports:
      - 10300:10300
    restart: unless-stopped
